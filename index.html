<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>ADAPT-D — Dementia Discharge Support</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/stlite.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0f4f8; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: 'Segoe UI', Inter, Arial, sans-serif; color: #1a3a5c;
      background: #f0f4f8; z-index: 9999; transition: opacity .4s ease;
    }
    #boot .ring {
      width: 46px; height: 46px; border: 4px solid #cdd9e5;
      border-top-color: #1a3a5c; border-radius: 50%; animation: spin 1s linear infinite;
    }
    #boot .t { font-size: 1.05rem; font-weight: 600; }
    #boot .s { font-size: .8rem; color: #5a7184; max-width: 320px; text-align: center; line-height: 1.5; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="ring"></div>
    <div class="t">Loading ADAPT-D…</div>
    <div class="s">First load downloads the Python runtime (one-time, then cached). Subsequent visits are fast.</div>
  </div>
  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/stlite.js";

    const controller = mount(
      {
        requirements: ["plotly", "pandas", "numpy"],
        entrypoint: "app.py",
        files: {
        "app.py": { url: "./app.py" },
        "config.py": { url: "./config.py" },
        "data_loader.py": { url: "./data_loader.py" },
        ".streamlit/config.toml": { url: "./.streamlit/config.toml" },
        "tabs/__init__.py": { url: "./tabs/__init__.py" },
        "tabs/shared_components.py": { url: "./tabs/shared_components.py" },
        "tabs/tab_about.py": { url: "./tabs/tab_about.py" },
        "tabs/tab1_patient_risk.py": { url: "./tabs/tab1_patient_risk.py" },
        "tabs/tab3_explainability.py": { url: "./tabs/tab3_explainability.py" },
        "tabs/tab4_decision_support.py": { url: "./tabs/tab4_decision_support.py" },
        "tabs/tab7_equity_monitoring.py": { url: "./tabs/tab7_equity_monitoring.py" },
        "tabs/tab8_model_performance.py": { url: "./tabs/tab8_model_performance.py" },
        "tabs/tab_population_insights.py": { url: "./tabs/tab_population_insights.py" },
        "data/dashboard_patients.csv": { url: "./data/dashboard_patients.csv" },
        "data/fairness_data.csv": { url: "./data/fairness_data.csv" },
        "data/shap_data_prototype.csv.gz": { url: "./data/shap_data_prototype.csv.gz" },
        "data/threshold_performance.csv": { url: "./data/threshold_performance.csv" }
        }
      },
      document.getElementById("root")
    );

    // Hide the boot splash once Streamlit has painted something into #root
    const root = document.getElementById("root");
    const boot = document.getElementById("boot");
    const obs = new MutationObserver(() => {
      if (root.querySelector('[data-testid="stApp"], .stApp, iframe')) {
        boot.style.opacity = "0";
        setTimeout(() => boot.remove(), 450);
        obs.disconnect();
      }
    });
    obs.observe(root, { childList: true, subtree: true });
  </script>
</body>
</html>
